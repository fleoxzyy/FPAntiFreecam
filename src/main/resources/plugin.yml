name: FPAntiFreeCam
version: '${version}'
main: me.fleoxxzy.FPAntiFreeCam.FPAntiFreeCam
api-version: '1.19'
folia-supported: true
load: STARTUP
authors: [ Fleoxzyy ]
description: >
  Anti-FreeCam plugin.
  Hides underground blocks/entities via packet manipulation when a player
  is at or above the configured surface Y level, making FreeCam mods see void.
website: https://github.com/fleoxzyy/FPAntiFreeCam
depend: [ packetevents ]
softdepend: [ Geyser-Spigot, floodgate ]

commands:
  fpac:
    description: Main FPAntiFreeCam command.
    usage: /fpac <reload|debug|world|stats|bypass|help> [args]
    permission: fpantifreecam.admin
    aliases: [ fpafc, antifreecam ]
  fpreload:
    description: Reloads FPAntiFreeCam configuration.
    usage: /fpreload
    permission: fpantifreecam.admin
    aliases: [ fpacreload ]
  fpdebug:
    description: Toggles FPAntiFreeCam debug mode.
    usage: /fpdebug
    permission: fpantifreecam.admin
    aliases: [ fpacdebug ]

permissions:
  fpantifreecam.admin:
    description: >
      Full access to all FPAntiFreeCam admin commands. Does NOT include any
      bypass: grant fpantifreecam.bypass (or .bypass.freecam / .bypass.xray)
      explicitly to staff who should be exempt.
    default: op
    children:
      fpantifreecam.reload: true
      fpantifreecam.debug: true
      fpantifreecam.world: true
      fpantifreecam.alerts: true
  fpantifreecam.reload:
    description: Allows reloading the configuration.
    default: op
  fpantifreecam.debug:
    description: Allows toggling debug mode.
    default: op
  fpantifreecam.world:
    description: Allows managing protected world list.
    default: op
  fpantifreecam.bypass:
    description: >
      Exempt from both FreeCam protection and Anti-Xray. Either part can be
      turned back on by explicitly setting fpantifreecam.bypass.freecam or
      fpantifreecam.bypass.xray to false. Useful for staff/builders.
    default: false
  fpantifreecam.bypass.freecam:
    description: >
      Exempt from FreeCam protection only (they can still see underground
      blocks). When explicitly set, overrides fpantifreecam.bypass for FreeCam.
    default: false
  fpantifreecam.bypass.xray:
    description: >
      Exempt from Anti-Xray only (real ores are always sent). When explicitly
      set, overrides fpantifreecam.bypass for Anti-Xray.
    default: false
  fpantifreecam.alerts:
    description: >
      Receive in-game staff alerts when a player is flagged by
      freecam-detection (similar to an anticheat's alert feed).
    default: op
